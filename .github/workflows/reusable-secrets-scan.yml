name: Reusable - Secrets Scan

on:
  workflow_call:
    secrets:
      gitleaks-license:
        description: Optional Gitleaks Pro license key (not required for the OSS ruleset)
        required: false

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history -- a secret committed and later removed is still a leak

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.gitleaks-license }}
