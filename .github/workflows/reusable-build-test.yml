name: Reusable - Build, Test, Coverage

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Python project (pyproject.toml)
        type: string
        required: true
      python-version:
        description: Python version to build/test against
        type: string
        default: "3.11"
      min-coverage:
        description: Minimum branch coverage percentage required to pass
        type: number
        default: 90
      enable-type-check:
        description: Whether to run mypy. Disable for consumers that don't configure it.
        type: boolean
        default: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        if: inputs.enable-type-check
        run: mypy

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=${{ inputs.min-coverage }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: ${{ inputs.working-directory }}/coverage.xml
